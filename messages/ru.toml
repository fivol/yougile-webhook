# Everything this receiver says in a YouGile chat, in one file.
#
# The code is English, the chats it serves are not — so no user-facing wording
# lives in app.py. Translating the service means copying this file to
# messages/<lang>.toml and setting MESSAGES_LANG=<lang> in .env.
#
# Rules for editing:
#   * Keys are addressed as "table.key" from the code — renaming a key breaks
#     the message (it degrades to the bare key in the chat and an ERROR in the
#     log; nothing crashes).
#   * `{placeholder}` slots are filled by the code with already-formatted
#     values (`$12.34`, `1 234`, `2 ч 05 мин`). Drop a slot you don't need,
#     reorder them freely, but don't invent new ones — an unknown name renders
#     the template unfilled.
#   * A literal brace must be doubled: {{ }}.
#   * Four marks are understood, and turn into HTML for the chat and into
#     plain text for notifications:
#         # heading      - list item      **emphasis**
#         `literal`      [label](url)
#     A line of its own that is empty starts a new paragraph. Write no HTML
#     here: the chat panel is narrow and wraps, so lay messages out in short
#     lines separated by " · ", never in aligned columns.
#
# What is NOT here: prompts (prompts/*.txt), CONCURRENCY_BUSY_MESSAGE (.env,
# for backwards compatibility), and text sent to the agent rather than to the
# user (interrupt notices, prompt scaffolding) — that one is English on purpose.


# Nouns that follow a number. The code picks one of the three by the Slavic
# rule (1 ход · 2 хода · 5 ходов); a language without that distinction repeats
# the same word in all three keys.
[plural]
turns_one = "ход"
turns_few = "хода"
turns_many = "ходов"
tokens_one = "токен"
tokens_few = "токена"
tokens_many = "токенов"
sessions_one = "сессии"
sessions_few = "сессий"
sessions_many = "сессий"


# Ages, as used in "последний 2 ч 05 мин назад" and "пауза 3 д 4 ч" — always a
# duration, never a moment, because the templates put "назад" after it.
[age]
unknown = "?"
just_now = "меньше минуты"
minutes = "{minutes} мин"
hours = "{hours} ч {minutes:02d} мин"
hours_flat = "{hours} ч"
days = "{days} д {hours} ч"
days_flat = "{days} д"


# The block the agent appends to its own ack ("Продолжаю …"), when ACK_STATS=true.
# PLAIN TEXT ONLY — the agent pastes it into `text` too, where a mark would show
# as a literal character. Two short lines at most.
[stats]
session = "сессия {id}"
chain_position = " · {position}-я в цепочке"
context = "контекст {tokens}"
turn_cost = "этот ход ≈ {cost}"
session_cost = "за сессию ≈ {cost}"


# Both of these are folded into the ack the agent posts when it takes the task
# on, never sent as a message of their own — one turn, one message.

# `manual` rotation mode: the threshold is crossed but the human decides.
# Said once per session.
[advisory]
line = "{prefix} Контекст {tokens} · следующий ход ≈ {cost} при пороге {threshold} — пора начать новую сессию: /new"


# `auto` rotation mode: the session was actually retired and this turn runs in
# a fresh one. The retired session's full breakdown stays one /sessions away.
[rotation]
started = "{prefix} Новая сессия: {why} — продолжаю в ней"
previous = "прошлая {id} · контекст {tokens} · потрачено ≈ {spent} · ход на ней стоил бы ≈ {expected} при пороге {threshold}"
reason_cost = "пауза {age}, кеш почти наверняка мёртв"
reason_hard_ctx = "контекст подошёл к пределу окна"
reason_command = "запрошено командой /new"


# /help
[help]
title = "# {prefix} Команды"
intro = "Отвечает обвязка — агент не запускается, токены не тратятся."
status = "- **/status** — контекст, кеш, траты, воркспейс, будет ли новая сессия"
sessions = "- **/sessions** — цепочка сессий задачи: id, причины смены, траты"
new = "- **/new** [что] — следующий ход принудительно в новой сессии"
keep = "- **/keep** — разово отменить запланированную авто-ротацию"
stop = "- **/stop** — прервать текущий ход агента"
help = "- **/help** — это сообщение"
mention = "**{mention}** «текст» — обращение к агенту · **{mention} /new** «текст» — ротация и сразу задача"
prices = "Суммы — оценка по прайсу API: ${price_in}/${price_out} за Mtok, запись в кеш ×{cache_write}, чтение ×{cache_read}"


# /status. Four blocks, in the order the questions get asked: what this session
# is, what happens next, where the work lives, housekeeping.
[status]
never_ran = "{prefix} По этому чату ещё не было ни одного хода агента."
title = "# {prefix} Статус — агент {agent}"
agent_busy = "работает"
agent_idle = "свободен"

session = "**Сессия** {position}-я из {total} · `{id}`"
context = "{tokens} · {turns} · последний {age} назад"
context_unknown = "контекста ещё нет — транскрипт не найден"
last_turn_warm = "✅ прошлый ход попал в кеш — {cost}"
last_turn_cold = "❌ прошлый ход мимо кеша — {cost} (read {read} · write {write})"
spent = "за сессию ≈ {total} — запись {write} · чтение {read} · вывод {output}"
spent_task = "за всю задачу ≈ {cost} по цепочке из {sessions}"

next_header = "**Дальше**"
next_unknown = "оценить нечем — сессия ещё ничего не потратила"
next_turn = "следующий ход ≈ {cost} → {verdict}"
verdict_rotate = "начнётся НОВАЯ сессия"
verdict_keep = "продолжу текущую"
verdict_advisory_only = " (режим {mode} — только предупрежу)"
next_if_idle = "после часа простоя ≈ {cost} → и тогда новая"
policy = "порог {threshold} за ход · потолок {ctx_cap} токенов · режим {mode}"
cache_decay = "кеш стынет: {buckets}"
cache_decay_bucket = "{percent}% {after}"
cache_decay_after_0_10 = "за 10 мин"
cache_decay_after_10_30 = "за полчаса"
cache_decay_after_30_60 = "за час"
cache_decay_after_60plus = "дальше"

workspace = "**Воркспейс** {name} · ветка `{branch}`"
workspace_mixed = "**Воркспейс** {name}"
workspace_unreadable = "**Воркспейс** {name} — .feature.json нечитаем"
repo = "- {repo} {bits}"
repo_base = "→ {base}"
repo_branch = "ветка `{branch}`"
repo_pr = "[{label}]({url})"
repo_no_pr = "PR нет"
repo_preview = "[превью]({url})"
pr_number = "PR {number}"

processed_up_to = "обработано до сообщения {last_message_id}"


# /sessions
[sessions]
title = "# {prefix} Сессии задачи — {count} · всего ≈ {spent}"
retired = "- #{seq} `{id}` · {turns} · ≈ {cost} · закрыта {retired_at} ({reason})"
current = "- #{seq} `{id}` · {turns} · ≈ {cost} · **текущая**"
footer = "Открыть любую локально: `claude --resume <id>`"


# /new, /keep, /stop
[command]
new_ok = "{prefix} Принято — следующий ход начнётся в новой сессии."
new_reason = " Причина: {reason}"
keep_ok = "{prefix} Ок, следующий ход продолжит текущую сессию, даже если сработает порог."
stop_ok = "{prefix} Текущий ход прерван."
stop_idle = "{prefix} Сейчас по этой задаче ничего не выполняется."
not_allowed = "{prefix} Команда /{command} доступна только тем, кому разрешено обращаться к агенту (COMMAND_ALLOWED_EMAILS или allowed_sender_emails в rules.toml)."


# A turn that died without the agent answering. `reason` is claude's own error
# line, quoted as-is — it is not translated.
[turn_failure]
# claude exited non-zero and the cause was a session it couldn't open.
session_lost = "Не смог продолжить сессию этого чата — claude вышел с кодом {rc}:"
session_lost_footer = """
Транскрипт сессии не найден, контекст прошлых ходов утерян. Перезапускаю этот же ход в новой сессии — задачу перечитаю из чата, ветку и PR подхвачу из воркспейса."""
# ... and the same thing happened again in the fresh session.
session_lost_again = "Ход не запустился даже в новой сессии (код {rc}):"
session_lost_again_footer = """
Дальше не пробую, чтобы не крутиться в цикле. Позови {mention} ещё раз или посмотри logs/claude.log."""
# Any other non-zero exit.
generic = "Ход завершился с ошибкой (код {rc}). Последнее, что написал claude:"
generic_footer = """
Если ответа в чате нет — упомяни {mention} ещё раз, чтобы повторить. Полный лог: logs/claude.log."""
# The turn never launched at all.
not_started = "Не смог запустить агента — ход не стартовал ({why})."
not_started_footer = "Смотри logs/uvicorn.err. Упомяни {mention} ещё раз, чтобы повторить."
# The replay in the fresh session couldn't be launched.
replay_failed = "Не смог перезапустить ход в новой сессии ({why})."
replay_failed_footer = "Упомяни {mention} ещё раз — сессия уже новая, запуск должен пройти."
# Used as the reason when claude died without printing anything at all.
no_output = "процесс завершился с кодом {rc}, не написав ни строчки"
